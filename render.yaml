# Render Blueprint: https://render.com/docs/blueprint-spec
# After pushing to GitHub: Render Dashboard → New → Blueprint → select this repo.
# Or create a "Web Service" manually and match the build/start commands below.

services:
  - type: web
    name: phyto-api
    runtime: python
    rootDir: phyto_backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Set real values in the Render dashboard (or mark sync: false and enter on first deploy).
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: phyto_db
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://YOUR-FRONTEND.onrender.com,http://localhost:3000
      - key: TREFLE_API_TOKEN
        sync: false
